name: Temporary security lock refresh

on:
  push:
    branches:
      - fix/security-audit-next-16-3-4-20260909

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/security-audit-next-16-3-4-20260909
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Refresh Next.js security lock
        run: npm install next@16.3.4 --save-exact --package-lock-only --ignore-scripts

      - name: Verify locked install
        run: npm ci

      - name: Verify high/critical audit gate
        run: npm audit --audit-level=high

      - name: Commit dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
            exit 0
          fi
          git commit -m "fix(security): upgrade Next.js dependency baseline"
          git push origin HEAD:fix/security-audit-next-16-3-4-20260909
