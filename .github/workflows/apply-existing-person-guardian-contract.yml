name: Apply existing-person guardian contract

on:
  push:
    branches:
      - automation/existing-person-guardian-contract-patch
    paths:
      - '.github/workflows/apply-existing-person-guardian-contract.yml'

permissions:
  contents: write

concurrency:
  group: existing-person-guardian-contract-patch
  cancel-in-progress: false

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact scratch branch
        uses: actions/checkout@v4
        with:
          ref: automation/existing-person-guardian-contract-patch
          fetch-depth: 0

      - name: Apply deterministic source transformation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/apply_guardian_contract.py')
          source = path.read_text().replace('if count < 3:', 'if count < 2:', 1)
          exec(compile(source, str(path), 'exec'), {'__name__': '__main__'})
          PY
          python .github/fix_guardian_contract_typecheck.py
          git diff --check

      - name: Verify exact source scope
        shell: bash
        run: |
          set -euo pipefail
          { git diff --name-only -- src; git ls-files --others --exclude-standard -- src; } | sort -u > /tmp/actual-files
          cat > /tmp/expected-files <<'EOF'
          src/features/admin/students/components/student-create-additional-guardian-card.tsx
          src/features/admin/students/components/student-create-billing-step.tsx
          src/features/admin/students/components/student-create-guardian-provision-section.tsx
          src/features/admin/students/components/student-create-guardian-source-panel.tsx
          src/features/admin/students/components/student-create-wizard.tsx
          src/features/admin/students/utils/existing-person-guardian-contract.test.ts
          src/features/admin/students/utils/family-registration-apply-resolved.ts
          src/features/admin/students/utils/family-registration-batch-payload.ts
          src/features/admin/students/utils/family-registration-payload.ts
          src/features/admin/students/utils/normalize-person-search.ts
          src/features/admin/students/utils/resolve-guardian-account-presentation.ts
          src/features/admin/students/utils/student-create-additional-guardians.ts
          src/features/admin/students/utils/student-create-billing-responsibility.ts
          src/features/admin/students/utils/student-create-guardian-payload.ts
          src/types/student-360.ts
          src/types/student-enrollment-finance.ts
          EOF
          diff -u /tmp/expected-files /tmp/actual-files

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: Targeted guardian contract tests
        run: >-
          npx vitest run
          src/features/admin/students/utils/existing-person-guardian-contract.test.ts
          src/features/admin/students/utils/student-create-guardian-payload.test.ts
          src/features/admin/students/utils/resolve-guardian-account-presentation.test.ts
          src/features/admin/students/utils/family-registration-payload.test.ts
          src/features/admin/students/utils/family-registration-batch-payload.test.ts

      - name: Commit tested source and remove temporary automation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            src/types/student-360.ts \
            src/types/student-enrollment-finance.ts \
            src/features/admin/students/utils/student-create-billing-responsibility.ts \
            src/features/admin/students/utils/normalize-person-search.ts \
            src/features/admin/students/utils/resolve-guardian-account-presentation.ts \
            src/features/admin/students/utils/student-create-guardian-payload.ts \
            src/features/admin/students/utils/student-create-additional-guardians.ts \
            src/features/admin/students/utils/existing-person-guardian-contract.test.ts \
            src/features/admin/students/utils/family-registration-apply-resolved.ts \
            src/features/admin/students/utils/family-registration-batch-payload.ts \
            src/features/admin/students/utils/family-registration-payload.ts \
            src/features/admin/students/components/student-create-guardian-source-panel.tsx \
            src/features/admin/students/components/student-create-billing-step.tsx \
            src/features/admin/students/components/student-create-guardian-provision-section.tsx \
            src/features/admin/students/components/student-create-additional-guardian-card.tsx \
            src/features/admin/students/components/student-create-wizard.tsx
          git rm -- \
            .github/apply_guardian_contract.py \
            .github/fix_guardian_contract_typecheck.py \
            .github/guardian-contract.patch.part00 \
            .github/guardian-contract.patch.part01 \
            .github/guardian-contract.patch.part02 \
            .github/guardian-contract.patch.part03 \
            .github/guardian-contract.patch.part04 \
            .github/guardian-contract.patch.part05 \
            .github/workflows/apply-existing-person-guardian-contract.yml
          git diff --cached --check
          git commit -m 'fix(students): adopt existing-person guardian contract'
          git push origin HEAD:automation/existing-person-guardian-contract-patch
