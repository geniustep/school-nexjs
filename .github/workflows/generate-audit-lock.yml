name: Generate audit lock

on:
  push:
    branches:
      - chore/audit-lock-generator-20260901

permissions:
  contents: write

jobs:
  generate:
    if: github.event.head_commit.message != 'chore(deps): refresh audit lock'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate security lock update
        run: npm audit fix --package-lock-only --audit-level=high
      - name: Validate frozen install
        run: npm ci
      - name: Validate high-severity audit gate
        run: npm audit --audit-level=high
      - name: Persist generated lockfile on isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes to persist"
            exit 0
          fi
          git commit -m "chore(deps): refresh audit lock"
          git push origin HEAD:chore/audit-lock-generator-20260901
