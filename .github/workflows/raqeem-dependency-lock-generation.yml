name: Temporary security lockfile resolver (REMOVE BEFORE MERGE)
on:
  push:
    branches:
      - fix/security-next-vitest-oct2026
permissions:
  contents: read
jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve exact pinned security versions without scripts
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e 'const fs=require("fs");const lock=fs.readFileSync("package-lock.json","utf8");const obj=JSON.parse(lock);if(obj.packages["node_modules/next"].version!=="16.4.2"||obj.packages["node_modules/vitest"].version!=="4.1.12")process.exit(5);const b=Buffer.from(lock).toString("base64");for(let i=0;i<b.length;i+=2500)console.log("RAQEEM_LOCK:"+b.slice(i,i+2500));'
