name: Dependency Lock Refresh

on:
  push:
    branches:
      - fix/dev-ci-targeted-tests-20260813
    paths:
      - .github/workflows/dependency-refresh.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lock:
    name: validate-and-commit-security-upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      ODOO_BASE_URL: https://app.propanel.ma
      ODOO_DB: school
      TENANT_ROOT_DOMAIN: raqeem.ma
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: fix/dev-ci-targeted-tests-20260813
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Pin patched direct dependencies
        run: |
          npm pkg set dependencies.next=16.3.0
          npm pkg set devDependencies.vitest=3.2.7

      - name: Rebuild lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts

      - name: Apply non-breaking audit fixes
        run: npm audit fix --package-lock-only --ignore-scripts || true

      - name: Install patched locked dependencies
        run: npm ci

      - name: TypeScript compatibility
        run: npm run typecheck

      - name: Targeted test suite
        run: npm test

      - name: Next.js 16 production build
        run: npm run build

      - name: Verify no high or critical audit findings remain
        run: npm audit --audit-level=high

      - name: Restore canonical lock-refresh workflow
        run: |
          cat > .github/workflows/dependency-refresh.yml <<'YAML'
          name: Dependency Lock Refresh

          on:
            push:
              branches: [dev]
              paths:
                - .github/workflows/dependency-refresh.yml
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            refresh-lock:
              name: refresh-security-lock
              runs-on: ubuntu-latest
              timeout-minutes: 15
              steps:
                - name: Checkout
                  uses: actions/checkout@v4

                - name: Setup Node.js
                  uses: actions/setup-node@v4
                  with:
                    node-version: "22"
                    cache: npm

                - name: Pin patched direct dependencies
                  run: |
                    npm pkg set dependencies.next=15.5.23
                    npm pkg set devDependencies.vitest=3.2.7

                - name: Rebuild lockfile without lifecycle scripts
                  run: npm install --package-lock-only --ignore-scripts

                - name: Apply non-breaking audit fixes to lockfile
                  run: npm audit fix --package-lock-only --ignore-scripts

                - name: Record residual audit findings
                  run: npm audit --audit-level=high || true

                - name: Upload patched manifests
                  uses: actions/upload-artifact@v4
                  with:
                    name: security-patched-manifests
                    path: |
                      package.json
                      package-lock.json
                    if-no-files-found: error
                    retention-days: 1
          YAML

      - name: Commit exact security upgrade changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/dependency-refresh.yml
          git diff --cached --check
          git diff --cached --quiet && { echo "No security upgrade changes to commit"; exit 1; }
          git commit -m "SEC-1: upgrade Next.js security baseline"
          git push origin HEAD:fix/dev-ci-targeted-tests-20260813
